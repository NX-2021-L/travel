name: CI

on:
  pull_request:
  push:
    branches: [main]

# id-token is used ONLY to fetch a read-only CodeArtifact token for the private
# io-kit-mcp-edge package (the lambda cannot even be imported without it). The tests
# themselves are hermetic: moto, local fixtures, no live table, no deploy.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load deployment settings
        run: python3 scripts/load_deployment_settings.py deploy/settings.env
      # The deploy role's trust policy admits refs/heads/main only, so on pull_request this
      # step cannot assume it. CI then degrades to the tests that do not import the private
      # package (reported loudly) instead of going red or silently skipping. On push to main
      # the full suite runs. Widening the trust to pull_request is an IAM change for io.
      - name: Configure AWS credentials (OIDC, package read only)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install test requirements (limited set when the private package is unreachable)
        run: |
          if [ "${{ steps.aws.outcome }}" != "success" ]; then
            echo "::warning::CI LIMITED: cannot assume the AWS role on this ref (trust policy); running only tests that do not import io-kit-mcp-edge"
            pip install pytest PyYAML --quiet
            exit 0
          fi
          TOKEN=$(aws codeartifact get-authorization-token --domain "${CODEARTIFACT_DOMAIN}" --domain-owner "${CODEARTIFACT_OWNER}" --region "${CODEARTIFACT_REGION}" --query authorizationToken --output text)
          echo "::add-mask::${TOKEN}"
          pip install -r tests/requirements.txt \
            --extra-index-url "https://aws:${TOKEN}@${CODEARTIFACT_DOMAIN}-${CODEARTIFACT_OWNER}.d.codeartifact.${CODEARTIFACT_REGION}.amazonaws.com/pypi/${CODEARTIFACT_REPOSITORY}/simple/" --quiet
      - uses: actions/setup-node@v4
        if: steps.aws.outcome == 'success'
        with:
          node-version: "22"
      - name: Install the published @io-kit/records (CodeArtifact npm)
        if: steps.aws.outcome == 'success'
        run: |
          T=$(aws codeartifact get-authorization-token --domain "${CODEARTIFACT_DOMAIN}" --domain-owner "${CODEARTIFACT_OWNER}" --region "${CODEARTIFACT_REGION}" --query authorizationToken --output text)
          echo "::add-mask::${T}"
          E="https://${CODEARTIFACT_DOMAIN}-${CODEARTIFACT_OWNER}.d.codeartifact.${CODEARTIFACT_REGION}.amazonaws.com/npm/${CODEARTIFACT_REPOSITORY}/"
          cd tests/conformance
          printf '@io-kit:registry=%s\n//%s:_authToken=%s\n' "$E" "${E#https://}" "$T" > .npmrc
          npm install --no-save --no-package-lock "@io-kit/records@0.4.0" --silent
          rm -f .npmrc
          node -e 'import("@io-kit/records/testing").then(m => console.log("conformance cases (read-only):", m.READ_ONLY_CASES.length))'
      - name: pytest
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
        run: |
          if [ "${{ steps.aws.outcome }}" = "success" ]; then pytest tests/; else pytest tests/test_release_ops.py tests/test_settings_fail_closed.py tests/test_no_instance_values.py tests/test_travel_deployment_template.py tests/test_door.py tests/test_door_acting_person.py tests/test_isolation_verification.py; fi
      # FLY-TSK-088 (BRD DOC-D14184D324F0 T-2 read half): the @io-kit/records corpus, read-only mode, against the local
      # records server on synthetic fixtures. The published kit comes from CodeArtifact npm, so like the full suite it
      # runs where the role can be assumed (push to main) and is reported as limited elsewhere.
      - name: Records conformance (read groups, published kit)
        if: steps.aws.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SESSION_TOKEN: testing
        run: |
          python3 tests/records_local_server.py 0 > "$RUNNER_TEMP/records_server.out" 2>&1 &
          for i in $(seq 1 50); do grep -q '^READY ' "$RUNNER_TEMP/records_server.out" && break; sleep 0.2; done
          read -r _ PORT DOOR < "$RUNNER_TEMP/records_server.out"
          echo "::add-mask::${DOOR}"
          node tests/conformance/run_records_conformance.mjs "$PORT" "$DOOR"
      - name: Caps snapshot drift check
        if: steps.aws.outcome == 'success'
        run: python3 scripts/emit_caps.py --check
