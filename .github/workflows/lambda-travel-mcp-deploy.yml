name: Lambda Deploy - travel-mcp

# Deploy path (FLY-TSK-027-0A): plan -> apply -> verify -> undo.
# There is NO alias: CloudFront fronts the unqualified Function URL, so $LATEST serves live
# traffic. The way back is a version restore onto $LATEST (scripts/release_ops.py restore),
# which needs only permissions the deploy role holds.
# The `paths:` filter below is asserted by tests/test_release_ops.py -- do not broaden it.

on:
  push:
    branches: [main]
    paths:
      - "backend/lambda/travel_mcp/**"
      - ".github/workflows/lambda-travel-mcp-deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = plan/apply/verify/undo; rollback = restore a published version onto $LATEST, nothing else"
        type: choice
        options: [deploy, rollback]
        default: deploy
      rollback_to_version:
        description: "rollback only: published version number to restore (blank = the previous release, i.e. the highest published version)"
        type: string
        required: false
        default: ""
      force_verify_fail:
        description: "DRILL: make one verify check fail on purpose so the automatic undo runs"
        type: boolean
        default: false
      drill_withhold_module:
        description: "DRILL: pretend the build expects this extra module (e.g. lane_drill.py) so the package check fails and the undo runs"
        type: string
        required: false
        default: ""
      reason:
        description: "Why this run is being triggered"
        type: string
        required: false
        default: "manual run"

permissions:
  contents: read
  id-token: write

# One run at a time against the function: a push deploy, a drill and a rollback must not
# interleave (they would publish and restore from each other's restore points). Queue, never
# cancel -- an in-flight deploy or restore must always finish.
concurrency:
  group: travel-mcp-deploy
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || inputs.action != 'rollback'
    runs-on: ubuntu-latest
    env:
      FORCE_VERIFY_FAIL: ${{ inputs.force_verify_fail && 'true' || 'false' }}
      DRILL_EXPECT_EXTRA_MODULE: ${{ inputs.drill_withhold_module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deployment settings
        run: python3 scripts/load_deployment_settings.py deploy/settings.env

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A required setting missing from the supplied + live environment makes this step exit 3: the run
      # stops here and apply never starts (FLY-TSK-028-0B, A-2).
      - name: Plan (read-only; changes nothing)
        env:
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
        run: python3 scripts/release_ops.py plan

      - name: Apply - publish restore point, then deploy
        id: apply
        env:
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_CLIENT_SECRET: ${{ secrets.COGNITO_CLIENT_SECRET }}
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          SERVER_BASE_URL: ${{ secrets.SERVER_BASE_URL }}
        run: |
          # A version snapshots code AND environment at publish time, so publishing BEFORE
          # deploy.sh captures the OLD release -- the restore point.
          PRE=$(aws lambda publish-version --function-name "${FUNCTION_NAME}" --region "${AWS_REGION}" \
                  --description "restore point before ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" \
                  --query Version --output text)
          echo "restore point: version ${PRE}"
          echo "pre_deploy_version=${PRE}" >> "$GITHUB_OUTPUT"
          bash backend/lambda/travel_mcp/deploy.sh

      - name: Install check dependencies (emit_caps imports the lambda, which needs io-kit-mcp-edge)
        run: |
          TOKEN=$(aws codeartifact get-authorization-token --domain "${CODEARTIFACT_DOMAIN}" --domain-owner "${CODEARTIFACT_OWNER}" --region "${CODEARTIFACT_REGION}" --query authorizationToken --output text)
          echo "::add-mask::${TOKEN}"
          pip install -r backend/lambda/travel_mcp/requirements.txt \
            --extra-index-url "https://aws:${TOKEN}@${CODEARTIFACT_DOMAIN}-${CODEARTIFACT_OWNER}.d.codeartifact.${CODEARTIFACT_REGION}.amazonaws.com/pypi/${CODEARTIFACT_REPOSITORY}/simple/" --quiet

      - name: Verify (read-only, production)
        id: verify
        continue-on-error: true
        run: |
          fail=0
          bash scripts/mcp_post_deploy_probe.sh "${PROBE_MCP_URL}" "${PROBE_SIGNIN_URL}" || { echo "CHECK FAILED: mcp probe"; fail=1; }
          aws lambda get-function --function-name "${FUNCTION_NAME}" --region "${AWS_REGION}" \
            --query 'Configuration.{State:State,LastUpdateStatus:LastUpdateStatus,Runtime:Runtime,MemorySize:MemorySize,Timeout:Timeout}' || fail=1
          STATE=$(aws lambda get-function --function-name "${FUNCTION_NAME}" --region "${AWS_REGION}" \
            --query 'Configuration.[State,LastUpdateStatus]' --output text | tr -s '[:space:]' ' ')
          [ "$STATE" = "Active Successful " ] || [ "$STATE" = "Active Successful" ] || { echo "CHECK FAILED: function state ($STATE)"; fail=1; }
          aws lambda get-function-url-config --function-name "${FUNCTION_NAME}" --region "${AWS_REGION}" \
            --query 'FunctionUrl' --output text >/dev/null || { echo "CHECK FAILED: function url config"; fail=1; }
          python3 scripts/emit_caps.py --check || { echo "CHECK FAILED: emit_caps --check"; fail=1; }
          # Token-free: reads the DEPLOYED $LATEST artifact (after apply) via lambda:GetFunction.
          python3 scripts/verify_deployed_package.py || { echo "CHECK FAILED: deployed package"; fail=1; }
          if [ "${FORCE_VERIFY_FAIL}" = "true" ]; then
            echo "CHECK FAILED: forced (FORCE_VERIFY_FAIL drill)"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "failed_at=$(date +%s)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Undo - restore previous release (automatic, on verify failure)
        id: undo
        if: steps.verify.outcome == 'failure'
        run: |
          VER="${{ steps.apply.outputs.pre_deploy_version }}"
          echo "verify failed at ${{ steps.verify.outputs.failed_at }}; restoring version ${VER}"
          python3 scripts/release_ops.py restore --version "${VER}"
          bash scripts/mcp_post_deploy_probe.sh "${PROBE_MCP_URL}" "${PROBE_SIGNIN_URL}"
          END=$(date +%s)
          TTR=$(( END - ${{ steps.verify.outputs.failed_at }} ))
          echo "time_to_recover_seconds=${TTR}" >> "$GITHUB_OUTPUT"
          echo "RECOVERED: probe passing again ${TTR}s after the verify failure"
          echo "### Undo: restored version ${VER}; time to recover ${TTR}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if verify failed (the failure stays visible)
        if: steps.verify.outcome == 'failure'
        run: |
          echo "verify failed; function restored to the previous release (see Undo step)"
          exit 1

  rollback:
    # One action by a person: Run workflow -> action=rollback. Does step 4 alone.
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load deployment settings
        run: python3 scripts/load_deployment_settings.py deploy/settings.env
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Undo - restore version onto $LATEST
        run: python3 scripts/release_ops.py restore --version "${{ inputs.rollback_to_version }}"
      - name: Probe the restored function
        run: bash scripts/mcp_post_deploy_probe.sh "${PROBE_MCP_URL}" "${PROBE_SIGNIN_URL}"
