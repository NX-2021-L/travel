AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  One deployment of travel: flights table, records table, execution role, MCP function,
  and (only for a public edge) a Function URL with its public invoke permission.
  The same template runs every deployment; every instance-specific value is a parameter.

Parameters:
  FlightsTableName:
    Type: String
    Description: Name of the flights table (hash key flight_id).
  RecordsTableName:
    Type: String
    Description: Name of the records table (lodging, car rental, drive, home place, correction).
  FunctionName:
    Type: String
    Description: Name of the MCP server function.
  RoleName:
    Type: String
    Description: Name of the function execution role.
  PublicEdge:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      "true" creates a public Function URL (auth NONE) and its public invoke permission.
      "false" creates neither, so the function is reachable only through IAM.
  SurfaceName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"
    ConstraintDescription: SURFACE_NAME is required by every door; letters, digits, dot, underscore and hyphen only.
    Description: Surface and connector name this deployment serves (SURFACE_NAME). Required; the function refuses to start without it.
  InternalInvokerRole:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$"
    ConstraintDescription: One role ARN, or empty. A wildcard is refused.
    Description: Role ARN the internal door answers (INTERNAL_INVOKER_ROLE); required when PublicEdge is false. Names a caller to the function; it grants nothing unless InvokerGrant is true.
  InvokerGrant:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      "true" adds the resource-policy grant that lets InternalInvokerRole invoke the function. "false" (default) names
      the role to the function and grants nobody, so no invoker is admitted at the resource policy.
  InternalDeployRole:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$"
    ConstraintDescription: One role ARN, or empty. A wildcard is refused.
    Description: Role ARN answered the one health read and nothing else (INTERNAL_DEPLOY_ROLE); optional.
  CodeS3Bucket:
    Type: String
    Default: ""
    Description: Bucket holding the function package. Empty = the function is made with a refusing stub and the deploy path ships the real package with lambda:UpdateFunctionCode.
  CodeS3Key:
    Type: String
    Default: ""
    Description: Key of the function package zip (used only with CodeS3Bucket).
  CodeS3ObjectVersion:
    Type: String
    Default: ""
    Description: Optional object version, so a new package is a deliberate, visible change.
  McpTransport:
    Type: String
    Default: streamable_http
    Description: Value of the MCP_TRANSPORT environment variable.
  CognitoUserPoolId:
    Type: String
    Default: ""
  CognitoClientId:
    Type: String
    Default: ""
  CognitoRegion:
    Type: String
    Default: ""
  CognitoAllowedSubs:
    Type: String
    Default: ""
  IographAllowedSubs:
    Type: String
    Default: ""

  FinanceReadFunction:
    Type: String
    Default: ""
    Description: Name (same account) or ARN of finance's Lambda function, invoked directly for the residence read (FLY-TSK-078). Empty = no finance call and no grant. Finance's own resource policy must also name this deployment's role.

Conditions:
  HasFinanceFunction: !Not [!Equals [!Ref FinanceReadFunction, ""]]
  FinanceReadIsArn: !Equals [!Select [0, !Split [":", !Ref FinanceReadFunction]], "arn"]
  IsPublicEdge: !Equals [!Ref PublicEdge, "true"]
  GrantsInvoker: !And [!Not [!Condition IsPublicEdge], !Not [!Equals [!Ref InternalInvokerRole, ""]], !Equals [!Ref InvokerGrant, "true"]]
  HasCodeBucket: !Not [!Equals [!Ref CodeS3Bucket, ""]]
  GrantsDeployer: !And [!Not [!Condition IsPublicEdge], !Not [!Equals [!Ref InternalDeployRole, ""]]]
  HasCodeVersion: !Not [!Equals [!Ref CodeS3ObjectVersion, ""]]

Resources:
  FlightsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref FlightsTableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - {AttributeName: flight_id, AttributeType: S}
        - {AttributeName: date_yyyy_mm, AttributeType: S}
        - {AttributeName: date_iso, AttributeType: S}
        - {AttributeName: origin, AttributeType: S}
        - {AttributeName: dest, AttributeType: S}
        - {AttributeName: trip_city, AttributeType: S}
      KeySchema:
        - {AttributeName: flight_id, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - {AttributeName: date_yyyy_mm, KeyType: HASH}
            - {AttributeName: date_iso, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: route-index
          KeySchema:
            - {AttributeName: origin, KeyType: HASH}
            - {AttributeName: dest, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: trip-city-index
          KeySchema:
            - {AttributeName: trip_city, KeyType: HASH}
            - {AttributeName: date_iso, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  # Single-table design for every non-flight record kind. pk is "<kind>#<id>" style, sk orders
  # versions/corrections under it. Place identity (FLY-TSK-026-0C): place-bearing fields are
  # stored as place_id (type:code) plus a pre-resolved area_id (city:slug), and every record
  # carries place_resolution in exact|geocoded|unresolved. area-index answers "everything in this
  # metro, in date order" as an equality on area_id.
  RecordsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref RecordsTableName
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # FLY-TSK-045 (A-38): new images on every deployment. Nothing in travel reads this stream; a projector owned
      # by another repository will. Adding it updates the table in place (no replacement).
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: area_id, AttributeType: S}
        - {AttributeName: date_iso, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: area-index
          KeySchema:
            - {AttributeName: area_id, KeyType: HASH}
            - {AttributeName: date_iso, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: travel-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt FlightsTable.Arn
                  - !Sub "${FlightsTable.Arn}/index/*"
                  - !GetAtt RecordsTable.Arn
                  - !Sub "${RecordsTable.Arn}/index/*"
        - !If
          - HasFinanceFunction
          - PolicyName: travel-finance-residence-invoke
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  # One action on one function. A bare name (her deployment) is the function in this stack's own
                  # account and region; an ARN (io's) is used as given. No account id is written in the repository.
                  Resource: !If
                    - FinanceReadIsArn
                    - !Ref FinanceReadFunction
                    - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FinanceReadFunction}"
          - !Ref AWS::NoValue

  McpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Role: !GetAtt ExecutionRole.Arn
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      Code:
        # With no bucket the function is made with a stub that answers nothing; the deploy path then ships the
        # package with lambda:UpdateFunctionCode (the permission a deploy role already holds). The stub's text
        # never changes, so a later stack update does not touch the shipped code.
        S3Bucket: !If [HasCodeBucket, !Ref CodeS3Bucket, !Ref "AWS::NoValue"]
        S3Key: !If [HasCodeBucket, !Ref CodeS3Key, !Ref "AWS::NoValue"]
        S3ObjectVersion: !If [HasCodeBucket, !If [HasCodeVersion, !Ref CodeS3ObjectVersion, !Ref "AWS::NoValue"], !Ref "AWS::NoValue"]
        ZipFile: !If
          - HasCodeBucket
          - !Ref "AWS::NoValue"
          - "def lambda_handler(event, context):\n    return {\"statusCode\": 503, \"body\": \"not deployed\"}\n"
      Environment:
        Variables:
          TABLE_NAME: !Ref FlightsTable
          RECORDS_TABLE_NAME: !Ref RecordsTable
          SURFACE_NAME: !Ref SurfaceName
          MCP_TRANSPORT: !Ref McpTransport
          DOOR_MODE: !If [IsPublicEdge, public, internal]
          INTERNAL_INVOKER_ROLE: !Ref InternalInvokerRole
          INTERNAL_DEPLOY_ROLE: !Ref InternalDeployRole
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_REGION: !Ref CognitoRegion
          COGNITO_ALLOWED_SUBS: !Ref CognitoAllowedSubs
          IOGRAPH_ALLOWED_SUBS: !Ref IographAllowedSubs
          FINANCE_READ_FUNCTION: !If [HasFinanceFunction, !Ref FinanceReadFunction, !Ref "AWS::NoValue"]

  # Public edge only: both resources below are guarded by IsPublicEdge. An internal
  # deployment gets no Function URL and no public invoke grant.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Condition: IsPublicEdge
    Properties:
      TargetFunctionArn: !GetAtt McpFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]
        AllowCredentials: true
        MaxAge: 3600

  FunctionUrlPublicInvoke:
    Type: AWS::Lambda::Permission
    Condition: IsPublicEdge
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Internal door only. THE authorization boundary: Lambda does not attest the caller inside an event, so the
  # in-function role check is a tripwire; these resource-policy grants (one role each, no wildcard) are the gate.
  InternalInvokerInvoke:
    Type: AWS::Lambda::Permission
    Condition: GrantsInvoker
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunction
      Principal: !Ref InternalInvokerRole

  InternalDeployerInvoke:
    Type: AWS::Lambda::Permission
    Condition: GrantsDeployer
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunction
      Principal: !Ref InternalDeployRole

Outputs:
  FlightsTableName:
    Value: !Ref FlightsTable
  RecordsTableName:
    Value: !Ref RecordsTable
  FunctionArn:
    Value: !GetAtt McpFunction.Arn
  FunctionUrl:
    Condition: IsPublicEdge
    Value: !GetAtt FunctionUrl.FunctionUrl
